services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: care_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"


  python-worker-api:
    build:
      context: .
      dockerfile: services/python-worker/Dockerfile
    environment:
      NODE_ENV: development
      PYTHON_WORKER_API_PORT: 8010
      PYTHON_WORKER_QUEUE_ENABLED: ${PYTHON_WORKER_QUEUE_ENABLED:-false}
      PYTHON_WORKER_JOB_STATUS_REDIS_ENABLED: ${PYTHON_WORKER_JOB_STATUS_REDIS_ENABLED:-false}
      PYTHON_WORKER_JOB_STATUS_TTL_SECONDS: ${PYTHON_WORKER_JOB_STATUS_TTL_SECONDS:-86400}
      PYTHON_WORKER_REQUIRE_SHARED_SECRET: ${PYTHON_WORKER_REQUIRE_SHARED_SECRET:-false}
      PYTHON_WORKER_REQUIRE_SIGNATURE: ${PYTHON_WORKER_REQUIRE_SIGNATURE:-false}
      PYTHON_WORKER_ALLOW_LEGACY_SECRET_HEADER: ${PYTHON_WORKER_ALLOW_LEGACY_SECRET_HEADER:-true}
      PYTHON_WORKER_SIGNATURE_TOLERANCE_SECONDS: ${PYTHON_WORKER_SIGNATURE_TOLERANCE_SECONDS:-300}
      PYTHON_WORKER_METRICS_ENABLED: ${PYTHON_WORKER_METRICS_ENABLED:-true}
      PYTHON_WORKER_OTEL_ENABLED: ${PYTHON_WORKER_OTEL_ENABLED:-false}
      PYTHON_WORKER_ARTIFACT_STORAGE_DIR: /artifacts
      PYTHON_WORKER_ROLLOUT_STATE_PATH: /state/rollout-state.json
      PYTHON_SERVICES_SHARED_SECRET: ${PYTHON_SERVICES_SHARED_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/care_center}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379}
    ports:
      - "8010:8010"
    volumes:
      - python-worker-artifacts:/artifacts
      - python-worker-state:/state
    depends_on:
      - postgres
      - redis

  python-worker-celery:
    build:
      context: .
      dockerfile: services/python-worker/Dockerfile
    command: ["celery", "-A", "carepoint_python_worker.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      NODE_ENV: development
      PYTHON_WORKER_QUEUE_ENABLED: "true"
      PYTHON_WORKER_JOB_STATUS_REDIS_ENABLED: "true"
      PYTHON_WORKER_JOB_STATUS_TTL_SECONDS: ${PYTHON_WORKER_JOB_STATUS_TTL_SECONDS:-86400}
      PYTHON_WORKER_REQUIRE_SHARED_SECRET: ${PYTHON_WORKER_REQUIRE_SHARED_SECRET:-false}
      PYTHON_WORKER_REQUIRE_SIGNATURE: ${PYTHON_WORKER_REQUIRE_SIGNATURE:-false}
      PYTHON_WORKER_ALLOW_LEGACY_SECRET_HEADER: ${PYTHON_WORKER_ALLOW_LEGACY_SECRET_HEADER:-true}
      PYTHON_WORKER_SIGNATURE_TOLERANCE_SECONDS: ${PYTHON_WORKER_SIGNATURE_TOLERANCE_SECONDS:-300}
      PYTHON_WORKER_METRICS_ENABLED: ${PYTHON_WORKER_METRICS_ENABLED:-true}
      PYTHON_WORKER_ARTIFACT_STORAGE_DIR: /artifacts
      PYTHON_WORKER_ROLLOUT_STATE_PATH: /state/rollout-state.json
      PYTHON_SERVICES_SHARED_SECRET: ${PYTHON_SERVICES_SHARED_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/care_center}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379}
    volumes:
      - python-worker-artifacts:/artifacts
      - python-worker-state:/state
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  python-worker-artifacts:
  python-worker-state:
