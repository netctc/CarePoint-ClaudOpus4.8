name: CarePoint CI
on:
  pull_request:
  push:
    branches: [main, develop]

# CI only needs repository read access. Keep GITHUB_TOKEN least-privileged so
# a compromised build dependency/action cannot mutate repository resources.
permissions:
  contents: read

concurrency:
  group: carepoint-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1-build-and-runtime:
    name: S1 backend build and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: care_center
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d care_center" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      API_PORT: 4000
      HEALTH_CHECK_TIMEOUT_MS: 2500
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/care_center
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/care_center
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters
      MEDICAL_PROFILE_ENCRYPTION_KEY: ci-medical-profile-key-minimum-32-chars
      FRONTEND_PROVIDER_URL: http://localhost:3000
      FRONTEND_ADMIN_URL: http://localhost:3001
      FRONTEND_PATIENT_URL: http://localhost:3002
      FRONTEND_PROVIDER_MOBILE_URL: http://localhost:8081
      FRONTEND_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8081
      ALLOW_LOCALHOST_CORS_WILDCARD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/python-worker/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run check:secrets
      - run: npm run verify:workspace
      - name: Validate VPS operations shell syntax
        run: bash -n deploy/vps/*.sh
      - run: npm run verify:release:deploy
      - run: npm run verify:python-worker
      - run: npm run test:python-worker
      - run: npm run verify:s1:config
      - run: npm run prisma:generate
      - run: npm run build:backend
      - run: npm run smoke:api:ci
      - run: npm run prisma:migrate:deploy --workspace @care-center/api
      - run: npm run test:api

  web-build:
    name: Web build (admin + provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Build-time placeholder only. Production runtime must fail closed rather
      # than present synthetic data when the API is unavailable.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - name: Strict TypeScript check (admin + provider)
        shell: bash
        run: |
          status=0
          npm exec --workspace @care-center/admin -- tsc --noEmit -p tsconfig.json || status=$?
          npm exec --workspace @care-center/provider -- tsc --noEmit -p tsconfig.json || status=$?
          exit "$status"
      - run: npm run build:web

  mobile-analyze:
    name: Flutter analyze + smoke/navigation tests (patient + provider mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [apps/mobile, apps/provider_mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: ${{ matrix.app }}
      - run: flutter analyze
        working-directory: ${{ matrix.app }}
      - run: flutter test --no-pub
        working-directory: ${{ matrix.app }}
