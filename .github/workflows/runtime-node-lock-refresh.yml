name: Runtime Node Lock Refresh

on:
  push:
    branches: [security/runtime-node-lock-refresh]

permissions:
  contents: write

concurrency:
  group: runtime-node-lock-refresh
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'

      - name: Refresh only security-relevant Node lock entries
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund next sharp engine.io socket.io-parser ws

      - name: Verify patched resolved versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const p = lock.packages || {};
          const expected = {
            'node_modules/next': '16.3.3',
            'node_modules/sharp': '0.35.4',
            'node_modules/engine.io': '6.6.10',
            'node_modules/socket.io-parser': '4.2.7',
            'node_modules/ws': '8.21.0',
          };
          let failed = false;
          for (const [key, version] of Object.entries(expected)) {
            const actual = p[key]?.version;
            console.log(`${key}: ${actual ?? 'missing'} (expected ${version})`);
            if (actual !== version) failed = true;
          }
          const postcss = p['node_modules/postcss']?.version;
          console.log(`node_modules/postcss: ${postcss ?? 'missing'}`);
          if (!postcss || Number(postcss.split('.')[0]) < 8) failed = true;
          if (failed) process.exit(1);
          NODE

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches requested patched graph."
            exit 0
          fi
          git config user.name "carepoint-release-bot"
          git config user.email "carepoint-release-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh patched Node dependency lock"
          git push origin HEAD:security/runtime-node-lock-refresh
