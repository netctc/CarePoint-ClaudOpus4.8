name: Runtime Base Candidate Scan

on:
  push:
    branches: [security/runtime-node-lock-refresh]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRIVY_VERSION: '0.74.0'
      TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
    steps:
      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "/tmp/${archive}" "$url"
          echo "${TRIVY_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Compare official base candidates
        shell: bash
        env:
          TRIVY_NO_PROGRESS: 'true'
        run: |
          set -euo pipefail
          images=(
            "node:22.23.2-bookworm-slim"
            "node:22.23.2-trixie-slim"
            "python:3.12.14-slim-trixie"
            "python:3.12.14-slim-bookworm"
            "python:3.12.14-alpine3.24"
            "postgres:16.15-alpine"
            "postgres:16.15-bookworm"
            "caddy:2.11.4-alpine"
          )
          printf '%-36s %8s %8s %8s %8s\n' IMAGE HIGH CRITICAL FIXABLE UNFIXED
          for image in "${images[@]}"; do
            safe="$(printf '%s' "$image" | tr '/:.' '___')"
            if ! docker pull "$image" >/dev/null; then
              printf '%-36s %s\n' "$image" "PULL_FAILED"
              continue
            fi
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output "/tmp/${safe}.json" "$image"
            python3 - "$image" "/tmp/${safe}.json" <<'PY'
          import json, sys
          image, path = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          high = critical = fixable = unfixed = 0
          for result in data.get("Results") or []:
              for v in result.get("Vulnerabilities") or []:
                  sev = str(v.get("Severity") or "").upper()
                  if sev == "HIGH": high += 1
                  elif sev == "CRITICAL": critical += 1
                  else: continue
                  if str(v.get("FixedVersion") or "").strip(): fixable += 1
                  else: unfixed += 1
          print(f"{image:36} {high:8} {critical:8} {fixable:8} {unfixed:8}")
          PY
          done

          echo
          echo "Building CarePoint Python worker on Alpine 3.24 candidate"
          docker build --file services/python-worker/Dockerfile.alpine-candidate --tag carepoint-python-alpine-candidate .
          echo "Running Python worker tests inside Alpine candidate"
          docker run --rm carepoint-python-alpine-candidate python -m pytest -q
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --format json --output /tmp/carepoint-python-alpine.json carepoint-python-alpine-candidate
          python3 - /tmp/carepoint-python-alpine.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          high = critical = fixable = unfixed = 0
          for result in data.get("Results") or []:
              for v in result.get("Vulnerabilities") or []:
                  sev = str(v.get("Severity") or "").upper()
                  if sev == "HIGH": high += 1
                  elif sev == "CRITICAL": critical += 1
                  else: continue
                  if str(v.get("FixedVersion") or "").strip(): fixable += 1
                  else: unfixed += 1
          print(f"{'carepoint-python-alpine-candidate':36} {high:8} {critical:8} {fixable:8} {unfixed:8}")
          PY
