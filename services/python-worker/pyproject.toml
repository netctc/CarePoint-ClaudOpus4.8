[project]
name = "carepoint-python-worker"
version = "0.27.0"
description = "CarePoint hybrid Python worker, canary, signed bridge and artifact service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "celery[redis]>=5.4,<6.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Silencia los DeprecationWarning (Pydantic v2 class-based config / parse_obj /
# Field(env=...), y HTTP_422 de Starlette). Son avisos cosmeticos, ocultos en
# runtime; se mantienen visibles los demas warnings (UserWarning, etc.).
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
